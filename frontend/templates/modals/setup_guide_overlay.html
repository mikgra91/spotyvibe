<!-- Setup guide detail overlay — shared by onboarding and base -->
<div class="setup-guide-overlay" id="setupGuideOverlay" role="dialog" aria-modal="true" aria-label="Setup guide">
    <button class="setup-guide-close" id="setupGuideClose" aria-label="Close">✕</button>
    <div class="setup-guide-scroll">
        <div class="setup-guide-card">
            <span class="setup-guide-pill">SETUP GUIDE</span>
            <h2 class="setup-guide-title" id="setupGuideTitle"></h2>
            <p class="setup-guide-subtitle" id="setupGuideSubtitle"></p>
            <ol class="setup-guide-steps" id="setupGuideSteps"></ol>
            <button class="setup-guide-done" id="setupGuideDone" data-i18n="ob.guide_done">I'm done — back to setup</button>
        </div>
    </div>
</div>

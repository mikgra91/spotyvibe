<!-- Style switcher -->
<div class="style-switcher" role="group" aria-label="Theme selection">
    <span class="style-switcher-label" data-i18n="app.theme" id="themeSwitcherLabel">Theme</span>
    <div class="style-switcher-options" id="styleSwitcher" role="radiogroup" aria-labelledby="themeSwitcherLabel">
        <button class="style-switcher-btn{% if current_theme == 'equalizer' %} active{% endif %}" data-theme="equalizer" onclick="switchTheme('equalizer')" role="radio" aria-checked="{% if current_theme == 'equalizer' %}true{% else %}false{% endif %}">Equalizer</button>
        <button class="style-switcher-btn{% if current_theme == 'pulse' %} active{% endif %}" data-theme="pulse" onclick="switchTheme('pulse')" role="radio" aria-checked="{% if current_theme == 'pulse' %}true{% else %}false{% endif %}">Pulse</button>
    </div>
</div>

<!-- Style switcher -->
<div class="style-switcher">
    <span class="style-switcher-label">Theme</span>
    <div class="style-switcher-options" id="styleSwitcher">
        <button class="style-switcher-btn{% if current_theme == 'equalizer' %} active{% endif %}" data-theme="equalizer" onclick="switchTheme('equalizer')">Equalizer</button>
        <button class="style-switcher-btn{% if current_theme == 'pulse' %} active{% endif %}" data-theme="pulse" onclick="switchTheme('pulse')">Pulse</button>
    </div>
</div>

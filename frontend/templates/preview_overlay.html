<!-- Spotify track preview overlay -->
<div class="spotify-preview-overlay {% if preview_track %}visible{% endif %}" id="spotifyPreviewOverlay" onclick="if(event.target===this)closePreviewOverlay()">
    <div class="preview-layout">
        <!-- Player container -->
        <div class="spotify-preview-panel">
            <button class="spotify-preview-close" onclick="closePreviewOverlay()" title="Close">✕</button>
            <div class="spotify-preview-title" id="spotifyPreviewTitle">
                {% if preview_track %}{{ preview_track.artist|e }} — {{ preview_track.title|e }}{% endif %}
            </div>
            <div class="spotify-preview-slider">
                <button class="spotify-preview-nav spotify-preview-prev" id="previewPrev" onclick="prevPreview()" title="Previous track">‹</button>
                <iframe id="spotifyPreviewIframe"
                    width="100%"
                    height="190"
                    frameborder="0"
                    allowfullscreen=""
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy"
                    {% if preview_track and preview_track.track_id %}
                    src="https://open.spotify.com/embed/track/{{ preview_track.track_id }}?utm_source=generator&theme=0"
                    {% endif %}>
                </iframe>
                <button class="spotify-preview-nav spotify-preview-next" id="previewNext" onclick="nextPreview()" title="Next track">›</button>
            </div>
            <div class="spotify-preview-counter" id="previewCounter"></div>
        </div>

        <!-- Action tabs (file-cabinet register style) -->
        <div class="preview-tab-actions" id="previewInlineActions">
            <button class="preview-tab preview-tab-like" id="previewTabLike" onclick="previewLike()" title="Like">
                <span class="preview-tab-icon">👍</span>
            </button>
            <button class="preview-tab preview-tab-dislike" id="previewTabDislike" onclick="previewDislike()" title="Dislike">
                <span class="preview-tab-icon">👎</span>
            </button>
            <button class="preview-tab preview-tab-dismiss" onclick="previewDismiss()" title="Remove from playlist">
                <span class="preview-tab-icon">✕</span>
            </button>
        </div>

        <!-- Feedback form panel (slides in from right) -->
        <div class="preview-feedback-panel" id="previewFeedbackPanel">
            <div class="preview-feedback-form">
                <div class="form-row">
                    <label for="previewFbArtist">Artist</label>
                    <input id="previewFbArtist" type="text">
                </div>
                <div class="form-row">
                    <label for="previewFbTrack">Track</label>
                    <input id="previewFbTrack" type="text">
                    <div class="form-hint">Leave empty to apply feedback to the artist in general.</div>
                </div>
                <div class="form-row">
                    <label for="previewFbReason">Reason (optional)</label>
                    <input id="previewFbReason" type="text" placeholder="e.g. perfect energy, boring melody…">
                </div>
                <div class="form-actions">
                    <button class="btn" id="previewFbSubmit" onclick="submitPreviewFeedback()">Submit</button>
                    <button class="btn btn-cancel" onclick="closePreviewFeedback()">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>

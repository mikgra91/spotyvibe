<!-- Spotify track preview overlay -->
<div class="spotify-preview-overlay {% if preview_track %}visible{% endif %}" id="spotifyPreviewOverlay" onclick="if(event.target===this)closePreviewOverlay()">
    <div class="spotify-preview-panel">
        <button class="spotify-preview-close" onclick="closePreviewOverlay()" title="Close">✕</button>
        <div class="spotify-preview-title" id="spotifyPreviewTitle">
            {% if preview_track %}{{ preview_track.artist|e }} — {{ preview_track.title|e }}{% endif %}
        </div>
        <div class="spotify-preview-slider">
            <button class="spotify-preview-nav spotify-preview-prev" id="previewPrev" onclick="prevPreview()" title="Previous track">‹</button>
            <iframe id="spotifyPreviewIframe"
                width="100%"
                height="190"
                frameborder="0"
                allowfullscreen=""
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"
                {% if preview_track and preview_track.track_id %}
                src="https://open.spotify.com/embed/track/{{ preview_track.track_id }}?utm_source=generator&theme=0"
                {% endif %}>
            </iframe>
            <button class="spotify-preview-nav spotify-preview-next" id="previewNext" onclick="nextPreview()" title="Next track">›</button>
        </div>
        <div class="spotify-preview-counter" id="previewCounter"></div>
    </div>
</div>

<!-- Spotify track preview overlay -->
<div class="spotify-preview-overlay {% if preview_track %}visible{% endif %}" id="spotifyPreviewOverlay" role="dialog" aria-modal="true" aria-label="Track preview" onclick="if(event.target===this)closePreviewOverlay()">
    <div class="preview-layout">
        <!-- Player container -->
        <div class="spotify-preview-panel">
            <button class="spotify-preview-close" onclick="closePreviewOverlay()" data-i18n-title="help.close" title="Close" aria-label="Close preview">✕</button>
            <div class="spotify-preview-title" id="spotifyPreviewTitle">
                {% if preview_track %}{{ preview_track.artist|e }} — {{ preview_track.title|e }}{% endif %}
            </div>
            <!-- Web Playback SDK custom panel (Premium, supported runtimes).
                 Hidden by default; preview.js shows it on successful SDK
                 connect and hides the iframe slider. -->
            <div class="sdk-player" id="sdkPlayer" hidden>
                <div class="sdk-player-row">
                    <img class="sdk-player-art" id="sdkPlayerArt" alt="" width="96" height="96">
                    <div class="sdk-player-meta">
                        <div class="sdk-player-title" id="sdkPlayerTitle"></div>
                        <div class="sdk-player-artist" id="sdkPlayerArtist"></div>
                    </div>
                </div>
                <div class="sdk-player-transport">
                    <button class="spotify-preview-nav" id="sdkPrev" onclick="prevPreview()" data-i18n-title="preview.previous" title="Previous track" aria-label="Previous track">‹</button>
                    <button class="sdk-player-play" id="sdkPlayToggle" onclick="sdkTogglePlay()" data-i18n-title="preview.play" title="Play/Pause" aria-label="Play or pause">▶</button>
                    <button class="spotify-preview-nav" id="sdkNext" onclick="nextPreview()" data-i18n-title="preview.next" title="Next track" aria-label="Next track">›</button>
                </div>
                <div class="sdk-player-scrubber">
                    <span class="sdk-player-time" id="sdkPlayerTimeCur">0:00</span>
                    <input type="range" id="sdkPlayerSeek" min="0" max="100" value="0" step="1" aria-label="Seek">
                    <span class="sdk-player-time" id="sdkPlayerTimeDur">0:00</span>
                </div>
                <div class="sdk-player-quick" role="group" aria-label="Quick feedback">
                    <button class="sdk-quick sdk-quick-like" id="sdkQuickLike" onclick="quickLike()" data-i18n-title="feedback.like" title="Like" aria-label="Like this track">
                        <span aria-hidden="true">👍</span>
                    </button>
                    <button class="sdk-quick sdk-quick-dislike" id="sdkQuickDislike" onclick="quickDislike()" data-i18n-title="feedback.dislike" title="Dislike" aria-label="Dislike this track">
                        <span aria-hidden="true">👎</span>
                    </button>
                </div>
            </div>

            <!-- Iframe fallback (non-Premium, unsupported runtimes, or SDK error). -->
            <div class="spotify-preview-slider" id="spotifyPreviewSlider">
                <button class="spotify-preview-nav spotify-preview-prev" id="previewPrev" onclick="prevPreview()" data-i18n-title="preview.previous" title="Previous track" aria-label="Previous track">‹</button>
                <iframe id="spotifyPreviewIframe"
                    title="Spotify track player"
                    width="100%"
                    height="190"
                    frameborder="0"
                    allowfullscreen=""
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy"
                    {% if preview_track and preview_track.track_id %}
                    src="https://open.spotify.com/embed/track/{{ preview_track.track_id }}?utm_source=generator&theme=0&_cb={{ range(1000000)|random }}"
                    {% endif %}>
                </iframe>
                <button class="spotify-preview-nav spotify-preview-next" id="previewNext" onclick="nextPreview()" data-i18n-title="preview.next" title="Next track" aria-label="Next track">›</button>
            </div>
            <div class="spotify-preview-counter" id="previewCounter"></div>
            <label class="spotify-preview-autoplay">
                <input type="checkbox" id="previewAutoplayToggle" onchange="togglePreviewAutoplay(event)" checked>
                <span data-i18n="preview.autoplay">Autoplay next track</span>
            </label>
        </div>

        <!-- Action tabs: Feedback (opens reason panel) + Delete -->
        <div class="preview-tab-actions" id="previewInlineActions" role="group" aria-label="Track actions">
            <button class="preview-tab preview-tab-feedback" id="previewTabFeedback" onclick="openPreviewFeedbackPanel()" data-i18n-title="feedback.open_panel" title="Feedback" aria-label="Give feedback on this track">
                <span class="preview-tab-icon" aria-hidden="true">💬</span>
                <span class="preview-tab-label" data-i18n="feedback.open_panel">Feedback</span>
            </button>
            <button class="preview-tab preview-tab-dismiss" onclick="previewDismiss()" data-i18n-title="preview.remove" title="Delete from playlist" aria-label="Delete from playlist">
                <span class="preview-tab-icon" aria-hidden="true">🗑</span>
                <span class="preview-tab-label" data-i18n="feedback.delete">Delete</span>
            </button>
        </div>

        <!-- Feedback form panel (slides in from right) -->
        <div class="preview-feedback-panel" id="previewFeedbackPanel">
            <div class="preview-feedback-form">
                <div class="form-row">
                    <label for="previewFbArtist" data-i18n="feedback.artist_label">Artist</label>
                    <input id="previewFbArtist" type="text">
                </div>
                <div class="form-row">
                    <label for="previewFbTrack" data-i18n="feedback.track_label">Track</label>
                    <input id="previewFbTrack" type="text">
                    <div class="form-hint" data-i18n="feedback.form_hint">Leave empty to apply feedback to the artist in general.</div>
                </div>
                <div class="form-row">
                    <label for="previewFbReason" data-i18n="feedback.reason_label">Reason (optional)</label>
                    <input id="previewFbReason" type="text" data-i18n-placeholder="feedback.reason_placeholder" placeholder="e.g. perfect energy, boring melody…">
                </div>
                <div class="form-actions form-actions-dual">
                    <button class="btn btn-submit-like" id="previewFbSubmitLike" onclick="submitPreviewFeedback('like')" data-i18n="feedback.submit_like">👍 Like</button>
                    <button class="btn btn-submit-dislike" id="previewFbSubmitDislike" onclick="submitPreviewFeedback('dislike')" data-i18n="feedback.submit_dislike">👎 Dislike</button>
                    <button class="btn btn-cancel" onclick="closePreviewFeedback()" data-i18n="btn.cancel">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>

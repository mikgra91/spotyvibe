<!-- Language toggle + Burger menu -->
<nav class="header-controls" aria-label="Site navigation">
    <div class="lang-toggle" id="langToggle" role="group" aria-label="Language">
        <button class="lang-toggle-btn active" data-lang="en" onclick="switchLanguage('en')" aria-label="English">EN</button>
        <span class="lang-toggle-sep" aria-hidden="true">|</span>
        <button class="lang-toggle-btn" data-lang="de" onclick="switchLanguage('de')" aria-label="Deutsch">DE</button>
        <span class="lang-toggle-sep" aria-hidden="true">|</span>
        <button class="lang-toggle-btn" data-lang="jp" onclick="switchLanguage('jp')" aria-label="日本語">JP</button>
    </div>
    <button id="spotifyStatusPill"
            class="spotify-status-pill spotify-status-unknown"
            type="button"
            onclick="toggleSpotifyConnection()"
            data-i18n-attr="aria-label:nav.spotify_status_unknown,title:nav.spotify_status_unknown"
            aria-label="Spotify status unknown"
            title="Spotify status unknown">
        <span class="spotify-status-dot" aria-hidden="true"></span>
        <span class="spotify-status-text" data-i18n="nav.spotify_status_label">Spotify</span>
    </button>
    <div class="burger-wrapper">
        <button class="burger-btn hidden" id="refreshBtn" onclick="location.reload()"
                title="Refresh" aria-label="Refresh page">↻</button>
        <button class="burger-btn" onclick="toggleSettingsMenu()" title="Menu" aria-label="Menu" aria-expanded="false" aria-controls="settingsDropdown">
            <span class="burger-icon" aria-hidden="true"></span>
            <span class="burger-icon" aria-hidden="true"></span>
            <span class="burger-icon" aria-hidden="true"></span>
        </button>
        <div class="settings-dropdown" id="settingsDropdown" role="menu">
            <div class="settings-dropdown-header" role="presentation" data-i18n="nav.group_configuration">CONFIGURATION</div>
            <button role="menuitem" onclick="openCredentials()"><span aria-hidden="true">🔑</span> <span data-i18n="nav.credentials">Credentials</span></button>
            <button role="menuitem" onclick="openSettings()"><span aria-hidden="true">⚙️</span> <span data-i18n="nav.settings">Settings</span></button>
            <button role="menuitem" onclick="openModal('presetManagerModal'); toggleSettingsMenu();"><span aria-hidden="true">🎛</span> <span data-i18n="nav.manage_presets">Manage presets</span></button>
            <button role="menuitem" id="spotifyToggleBtn" onclick="toggleSpotifyConnection()"><span aria-hidden="true">🔌</span> <span id="spotifyToggleLabel" data-i18n="{{ 'nav.disconnect_spotify' if spotify_connected else 'nav.connect_spotify' }}">{{ 'Disconnect Spotify' if spotify_connected else 'Connect Spotify' }}</span></button>
            <div class="settings-dropdown-sep" role="presentation"></div>
            <div class="settings-dropdown-header" role="presentation" data-i18n="nav.group_help">HELP & GUIDANCE</div>
            <button role="menuitem" onclick="openHelp()"><span aria-hidden="true">❓</span> <span data-i18n="nav.help">Help</span></button>
            <button role="menuitem" onclick="openQuickstart(true)"><span aria-hidden="true">🚀</span> <span data-i18n="nav.quickstart">Quick Start</span></button>
            <button role="menuitem" onclick="window.location.href='/onboarding?replay=1'"><span aria-hidden="true">🪄</span> <span data-i18n="nav.rerun_setup">Re-run setup</span></button>
            <button role="menuitem" onclick="resetTipsSeen(); toggleSettingsMenu();"><span aria-hidden="true">🔄</span> <span data-i18n="nav.reset_tips">Reset tips</span></button>
        </div>
    </div>
</nav>

<!-- Language toggle + Settings gear -->
<div class="header-controls">
    <div class="lang-toggle" id="langToggle">
        <button class="lang-toggle-btn active" data-lang="en" onclick="switchLanguage('en')">EN</button>
        <span class="lang-toggle-sep">|</span>
        <button class="lang-toggle-btn" data-lang="de" onclick="switchLanguage('de')">DE</button>
    </div>
    <div class="settings-wrapper">
        <button class="settings-btn" onclick="toggleSettingsMenu()" title="Settings">⚙️</button>
        <div class="settings-dropdown" id="settingsDropdown">
            <button onclick="openCredentials()">🔑 <span data-i18n="nav.credentials">Credentials</span></button>
            <button onclick="openSettings()">⚙️ <span data-i18n="nav.settings">Settings</span></button>
            <button id="spotifyToggleBtn" onclick="toggleSpotifyConnection()">
                {{ '🔌 Disconnect Spotify' if spotify_connected else '🔌 Connect Spotify' }}
            </button>
            <button onclick="openHelp()">❓ <span data-i18n="nav.help">Help</span></button>
        </div>
    </div>
</div>

<!-- ── Band/Song Analysis ── -->
<div class="analysis-section" id="analysisSection">
    <div class="train-header">
        <div class="train-header-left">
            <h2>🔍 Band/Song Analysis</h2>
        </div>
        <div class="train-header-actions">
            <button class="btn-train" id="analysisToggleBtn" onclick="toggleAnalysisBody()">Open Analysis</button>
        </div>
    </div>
    <div class="train-body {% if last_analysis_result %}{% else %}hidden{% endif %}" id="analysisBody">
        <p class="acc-hint" style="margin-bottom:12px;">Enter an artist (and optional track) to get an AI analysis with ready-to-paste profile suggestions.</p>
        <div class="analysis-inputs">
            <div class="analysis-input-row">
                <input id="analysisArtist" type="text" placeholder="Artist / band name" maxlength="200" value="{{ artist_input if artist_input }}">
                <input id="analysisTrack" type="text" placeholder="Track name (optional)" maxlength="200" value="{{ track_input if track_input }}">
            </div>
            <button class="btn btn-save" id="analysisSendBtn" onclick="runAnalysis()">Analyse</button>
        </div>
        <div id="analysisResult" class="{% if last_analysis_result %}{% else %}hidden{% endif %}">
            {% if last_analysis_result %}{{ last_analysis_result }}{% endif %}
        </div>
    </div>
</div>

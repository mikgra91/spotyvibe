<div class="generate-section" id="generateSection">
    <div class="train-header" onclick="toggleGenerateBody()">
        <div class="train-header-left">
            <h2>🎧 <span data-i18n="generate.title">Spotify Playlist Creation</span> <button class="section-help-icon" onclick="event.stopPropagation(); openSectionHelp('playlist-generation')" data-i18n-title="help.section_help_title" title="Open help for this section">?</button></h2>
            <span class="train-status train-subtitle">Generate AI-powered playlists and save them directly to your Spotify account.</span>
        </div>
        <div class="train-header-actions">
            <button class="btn-train" id="generateToggleBtn" onclick="event.stopPropagation(); toggleGenerateBody()">Show</button>
        </div>
    </div>
    <div class="train-body hidden" id="generateBody">

    <!-- Playlist mode -->
    <div class="playlist-mode-row">
        <div class="playlist-mode-options">
            {% for mode in playlist_modes %}
            <label class="playlist-mode-option">
                <input type="radio" name="playlist_mode" value="{{ mode.value }}"
                    {% if current_playlist_mode == mode.value %}checked{% endif %}
                    onchange="onPlaylistModeChange()"> {{ mode.label }}
            </label>
            {% endfor %}
        </div>
        <div id="playlistNameRow" class="playlist-name-row {% if current_playlist_mode in ('create',) %}{% else %}hidden{% endif %}">
            <input id="playlistNameInput" type="text" placeholder="Playlist name (supports {date}, {style})" maxlength="200" class="playlist-name-input" value="{{ playlist_name if playlist_name }}">
        </div>
        <div id="playlistPickerRow" class="playlist-picker-row {% if current_playlist_mode in ('append', 'replace') %}{% else %}hidden{% endif %}">
            <select id="playlistPicker" class="playlist-picker-select">
                {% if playlist_options %}
                    {% for pl in playlist_options %}
                    <option value="{{ pl.id }}">{{ pl.name }}</option>
                    {% endfor %}
                {% else %}
                <option value="">Loading playlists…</option>
                {% endif %}
            </select>
        </div>
    </div>

    <!-- Dependency status indicators -->
    <div class="generate-deps-row" id="generateDepsRow">
        <span class="dep-chip" id="depOpenai">
            <span class="dep-dot dep-dot--unknown"></span>
            <span class="dep-label">OpenAI</span>
        </span>
        <span class="dep-chip" id="depSpotify">
            <span class="dep-dot dep-dot--unknown"></span>
            <span class="dep-label">Spotify</span>
        </span>
    </div>

    <div class="run-section">
        <button class="btn-run" id="runBtn" onclick="runPipeline()" {% if not can_generate %}disabled{% endif %}>▶ <span data-i18n="btn.generate">Generate &amp; Create Playlist</span></button>
        <button class="btn-run-cancel hidden" id="cancelBtn" onclick="cancelGeneration()">⛔ <span data-i18n="btn.cancel_generation">Cancel</span></button>
        <button class="btn-use-tracks hidden" id="useTracksBtn" onclick="useCurrentTracks()">▶ Use 0 tracks now</button>
    </div>
    <div id="runWarn" class="{% if not can_generate %}{% else %}hidden{% endif %}">
        {% if not can_generate %}
        <span class="component-warn">⚠️ Cannot generate — check credentials and Spotify connection.</span>
        {% endif %}
    </div>
    </div>
</div>

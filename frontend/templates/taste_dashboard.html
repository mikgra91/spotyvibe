<!-- Taste visualisation dashboard (Wave 3 F.1) -->
<div class="taste-dashboard-section" id="tasteDashboardSection">
    <div class="train-header" role="button" tabindex="0" onclick="toggleDashboardBody()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleDashboardBody()}" aria-expanded="false" aria-controls="dashboardBody">
        <div class="train-header-left">
            <h2><span aria-hidden="true">📊</span> <span data-i18n="dashboard.title">Your taste at a glance</span></h2>
            <span class="train-status train-subtitle" data-i18n="dashboard.subtitle">Aggregated from your recent playlists and history.</span>
        </div>
        <div class="train-header-actions">
            <button class="btn-train" id="dashboardToggleBtn" onclick="event.stopPropagation(); toggleDashboardBody()" data-i18n="btn.show" aria-expanded="false" aria-controls="dashboardBody">Show</button>
        </div>
    </div>
    <div class="train-body hidden" id="dashboardBody">
        <!-- Neutral (main) section — always shown when data exists -->
        <div class="dashboard-section" id="dashboardNeutral">
            <div class="dashboard-grid hidden">
                <div class="dashboard-card dashboard-card--genres"></div>
                <div class="dashboard-card dashboard-card--scatter"></div>
                <div class="dashboard-card dashboard-card--decades"></div>
            </div>
        </div>

        <!-- Liked sub-section -->
        <div class="dashboard-section dashboard-section--sentiment hidden" id="dashboardLiked">
            <h3 class="dashboard-section-heading dashboard-section-heading--liked">
                <span aria-hidden="true">👍</span> <span data-i18n="dashboard.section_liked">Tracks you liked</span>
            </h3>
            <div class="dashboard-grid">
                <div class="dashboard-card dashboard-card--genres"></div>
                <div class="dashboard-card dashboard-card--scatter"></div>
                <div class="dashboard-card dashboard-card--decades"></div>
            </div>
        </div>

        <!-- Disliked sub-section -->
        <div class="dashboard-section dashboard-section--sentiment hidden" id="dashboardDisliked">
            <h3 class="dashboard-section-heading dashboard-section-heading--disliked">
                <span aria-hidden="true">👎</span> <span data-i18n="dashboard.section_disliked">Tracks you disliked</span>
            </h3>
            <div class="dashboard-grid">
                <div class="dashboard-card dashboard-card--genres"></div>
                <div class="dashboard-card dashboard-card--scatter"></div>
                <div class="dashboard-card dashboard-card--decades"></div>
            </div>
        </div>

        <p class="dashboard-info hidden" id="dashboardInfo">
            <span data-i18n="dashboard.generated_note">Statistics are generated each time a playlist is created.</span>
            <span id="dashboardTrackCount"></span>
        </p>
        <div class="dashboard-empty">
            <div class="dashboard-empty-icon" aria-hidden="true">📊</div>
            <p class="dashboard-empty-title" data-i18n="dashboard.empty_title">Not enough data yet</p>
            <p data-i18n="dashboard.empty_body">Generate a few playlists to see your taste profile.</p>
        </div>
    </div>
</div>

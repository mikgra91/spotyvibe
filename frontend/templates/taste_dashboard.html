<!-- Taste visualisation dashboard (Wave 3 F.1) -->
<section class="taste-dashboard-section accordion-panel">
    <div class="accordion-header" role="button" tabindex="0" aria-expanded="true">
        <h3><span aria-hidden="true">📊</span> <span data-i18n="dashboard.title">Your taste at a glance</span></h3>
        <span class="accordion-chevron rotated" aria-hidden="true">▸</span>
    </div>
    <div class="accordion-body">
        <div class="accordion-body-inner">
            <p class="acc-hint" data-i18n="dashboard.subtitle">Aggregated from your recent playlists and history.</p>
            <div class="dashboard-grid">
                <div class="dashboard-card dashboard-card--genres"></div>
                <div class="dashboard-card dashboard-card--scatter"></div>
                <div class="dashboard-card dashboard-card--decades"></div>
            </div>
            <div class="dashboard-empty hidden">
                <div class="dashboard-empty-icon" aria-hidden="true">📊</div>
                <p data-i18n="dashboard.empty_body">Generate a few playlists to see your taste profile.</p>
            </div>
        </div>
    </div>
</section>

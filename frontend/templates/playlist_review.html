<!-- ── Refine Playlist ── -->
<div class="review-section" id="reviewSection">
    <div class="train-header" role="button" tabindex="0" onclick="toggleReviewBody()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleReviewBody()}" aria-expanded="false" aria-controls="reviewBody">
        <div class="train-header-left">
            <h2><span aria-hidden="true">🔄</span> <span data-i18n="review.title">Refine Playlist</span> <button class="section-help-icon" onclick="event.stopPropagation(); openSectionHelp('refine-playlist')" data-i18n-title="help.section_help_title" title="Open help for this section" aria-label="Help for Refine Playlist">?</button></h2>
            <span class="train-status train-subtitle" data-i18n="review.subtitle">Load an existing playlist and give track-by-track feedback to refine your taste profile.</span>
        </div>
        <div class="train-header-actions">
            <button class="btn-train" id="reviewToggleBtn" onclick="event.stopPropagation(); toggleReviewBody()" aria-expanded="false" aria-controls="reviewBody">Show</button>
        </div>
    </div>
    <div class="train-body hidden" id="reviewBody">
        <div class="playlist-picker-row">
            <label for="reviewPlaylistPicker" class="sr-only">Select a playlist to review</label>
            <select id="reviewPlaylistPicker" class="playlist-picker-select">
                <option value="">Select a playlist…</option>
            </select>
            <button class="playlist-refresh-btn" onclick="refreshReviewPlaylistPicker()" aria-label="Refresh playlist list" data-i18n-title="playlist.refresh_aria" title="Refresh playlist list">↻</button>
            <button class="playlist-delete-btn" onclick="deleteSelectedPlaylist('reviewPlaylistPicker')" aria-label="Delete selected playlist" data-i18n-title="playlist.delete_aria" title="Delete selected playlist">🗑</button>
        </div>
        <div class="run-section">
            <button class="btn-run" id="reviewLoadBtn" onclick="loadPlaylistTracks()"><span aria-hidden="true">🔄</span> <span data-i18n="btn.load_playlist">Load Playlist</span></button>
        </div>
        <!-- Inline loading area (spinner only) -->
        <div class="loading-area hidden" id="reviewLoadingArea" aria-live="polite">
            <div class="loading-spinner" aria-label="Loading"></div>
        </div>

        <!-- ── Review tracklist (inside section body) ── -->
        <div id="reviewTrackArea" class="hidden">
            <hr class="inline-divider">
            <div class="songlist-counter-row">
                <span id="reviewTrackCounter" class="songlist-counter"></span>
            </div>
            <ul id="reviewTrackList" class="track-list"></ul>
        </div>
    </div>
</div>

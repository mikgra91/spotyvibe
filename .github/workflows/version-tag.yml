name: Tag Main on PR Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.PAT_TOKEN }}

      - name: Get version from version.py
        id: get_version
        run: |
          VERSION=$(python -c 'exec(open("version.py").read()); print(__version__)')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine tag name
        id: gen_tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # Decide prefix (v* for prod, beta-* for beta)
          if [[ "$VERSION" == *beta* || "$VERSION" == *dev* ]]; then
            TAG="beta-$VERSION"
          else
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check for existing tag
        id: tag_exists
        run: |
          TAG="${{ steps.gen_tag.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag if it does not exist
        if: steps.tag_exists.outputs.exists == 'false'
        run: |
          TAG="${{ steps.gen_tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Tag generated from version.py: $TAG"
          git push origin "$TAG"

      - name: Tag summary
        run: |
          TAG="${{ steps.gen_tag.outputs.tag }}"
          if [ "${{ steps.tag_exists.outputs.exists }}" = "true" ]; then
            echo "Tag $TAG already exists in the repository. No new tag pushed."
          else
            echo "Created and pushed tag: $TAG"
          fi
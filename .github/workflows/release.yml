name: Production Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'

      - run: pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller

      - name: Build Windows Executables
        shell: bash
        run: |
          ./build-tools/build_exe.sh --package
          ./build-tools/build_exe.sh --full

      - name: Archive one-folder package
        shell: bash
        run: |
          cd dist
          7z a spotyvibe_package.zip ./spotyvibe/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/spotyvibe_onefile.exe
            dist/spotyvibe_package.zip

  build-macos-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build macOS and Linux distributions
        run: |
          chmod +x build-tools/build_dist.sh build-tools/start.sh start.sh SpotyVibe.command
          bash build-tools/build_dist.sh all

      - uses: actions/upload-artifact@v4
        with:
          name: macos-linux
          path: |
            dist/SpotyVibe-macOS.zip
            dist/SpotyVibe-Linux.tar.gz

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK (release)
        run: |
          ./build-tools/build_apk.sh release
          cp android/app/build/outputs/apk/release/app-release.apk spotyvibe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: spotyvibe.apk

  release:
    needs: [build-windows, build-macos-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - uses: actions/download-artifact@v4
        with:
          name: macos-linux
      - uses: actions/download-artifact@v4
        with:
          name: android

      - name: Generate changelog from git log
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" > changes.txt
          else
            git log --pretty=format:"- %s" > changes.txt
          fi
          if [ ! -s changes.txt ]; then
            echo "No changes found for $TAG" > changes.txt
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changes.txt
          draft: false
          prerelease: false
          files: |
            spotyvibe.apk
            spotyvibe_onefile.exe
            spotyvibe_package.zip
            SpotyVibe-macOS.zip
            SpotyVibe-Linux.tar.gz

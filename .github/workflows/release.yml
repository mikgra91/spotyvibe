name: Production Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Run core tests
        run: python -m pytest core/tests/ -v --tb=short --junitxml=test-results/core.xml

      - name: Run frontend tests
        run: python -m pytest frontend/tests/ -v --tb=short --junitxml=test-results/frontend.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  build-windows:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'

      - run: pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller

      - name: Build Windows Executables
        shell: bash
        run: |
          ./build-tools/build_exe.sh --package
          ./build-tools/build_exe.sh --full

      - name: Archive one-folder package
        shell: bash
        run: |
          cd dist
          7z a spotyvibe_package.zip ./spotyvibe/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/spotyvibe_onefile.exe
            dist/spotyvibe_package.zip

  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel and package ZIP
        run: |
          pip install build
          python -m build --wheel
          mkdir -p dist/SpotyVibe
          cp dist/*.whl dist/SpotyVibe/
          cp build-tools/README-Install.txt dist/SpotyVibe/README.txt
          cd dist && zip -r SpotyVibe-macOS-Linux.zip SpotyVibe/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/SpotyVibe-macOS-Linux.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK (release)
        run: |
          ./build-tools/build_apk.sh release
          cp android/app/build/outputs/apk/release/app-release.apk spotyvibe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: spotyvibe.apk

  release:
    needs: [build-windows, build-wheel, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - uses: actions/download-artifact@v4
        with:
          name: wheel
      - uses: actions/download-artifact@v4
        with:
          name: android

      - name: Generate changelog from git log
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" > changes.txt
          else
            git log --pretty=format:"- %s" > changes.txt
          fi
          if [ ! -s changes.txt ]; then
            echo "No changes found for $TAG" > changes.txt
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changes.txt
          draft: false
          prerelease: false
          files: |
            spotyvibe.apk
            spotyvibe_onefile.exe
            spotyvibe_package.zip
            SpotyVibe-macOS-Linux.zip

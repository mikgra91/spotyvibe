name: Beta Release

on:
  push:
    tags:
      - 'beta-*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller

      - name: Build Windows Executables
        shell: bash
        run: |
          ./build-tools/build_exe.sh --package
          ./build-tools/build_exe.sh --full

      - name: Archive one-folder package
        shell: bash
        run: |
          cd dist
          7z a spotyvibe_package.zip ./spotyvibe/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/spotyvibe_onefile.exe
            dist/spotyvibe_package.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK (debug)
        run: |
          ./build-tools/build_apk.sh debug
          cp android/app/build/outputs/apk/debug/app-debug.apk spotyvibe-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: spotyvibe-debug.apk

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - uses: actions/download-artifact@v4
        with:
          name: android
      - uses: actions/checkout@v4

      - name: Extract changelog for beta tag
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          awk "/^##? $TAG\$/,/^## / { if (\$0 !~ /^##? $TAG\$/ && \$0 !~ /^## /) print }" CHANGELOG.md > changes.txt || echo "No changelog entry found."
          if [ ! -s changes.txt ]; then
            echo "No changelog found for $TAG" > changes.txt
          fi
      - id: get_changelog
        run: echo "CHANGELOG<<EOF" >> $GITHUB_ENV && cat changes.txt >> $GITHUB_ENV && echo "EOF" >> $GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ env.CHANGELOG }}
          draft: false
          prerelease: true
          files: |
            spotyvibe-debug.apk
            spotyvibe_onefile.exe
            spotyvibe_package.zip
name: Beta Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  check-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      is-beta: ${{ steps.check.outputs.is-beta }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Check if beta release
        id: check
        run: |
          VERSION=$(python -c 'exec(open("version.py").read()); print(__version__)')
          TAG="beta-$VERSION"

          if [[ "$VERSION" != *beta* && "$VERSION" != *dev* ]]; then
            echo "Version $VERSION is not a beta release. Skipping."
            echo "is-beta=false" >> $GITHUB_OUTPUT
          elif git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping release."
            echo "is-beta=false" >> $GITHUB_OUTPUT
          else
            echo "is-beta=true" >> $GITHUB_OUTPUT
          fi

  test:
    needs: check-version
    if: needs.check-version.outputs.is-beta == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Run core tests
        run: python -m pytest core/tests/ -v --tb=short --junitxml=test-results/core.xml

      - name: Run frontend tests
        run: python -m pytest frontend/tests/ -v --tb=short --junitxml=test-results/frontend.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  build-windows:
    needs: [check-version, test]
    if: needs.check-version.outputs.is-beta == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'

      - run: pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller

      - name: Build Windows Executables
        shell: bash
        run: |
          ./build-tools/build_exe.sh --package
          ./build-tools/build_exe.sh --full

      - name: Archive one-folder package
        shell: bash
        run: |
          cd dist
          7z a spotyvibe_package.zip ./spotyvibe/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/spotyvibe_onefile.exe
            dist/spotyvibe_package.zip

  build-wheel:
    needs: [check-version, test]
    if: needs.check-version.outputs.is-beta == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel and package ZIP
        run: |
          pip install build
          python -m build --wheel
          mkdir -p dist/SpotyVibe
          cp dist/*.whl dist/SpotyVibe/
          cp build-tools/README-Install.txt dist/SpotyVibe/README.txt
          cd dist && zip -r SpotyVibe-macOS-Linux.zip SpotyVibe/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/SpotyVibe-macOS-Linux.zip

  release:
    needs: [check-version, build-windows, build-wheel]
    if: needs.check-version.outputs.is-beta == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No token override — see the note in release.yml. The job's
      # `contents: write` is enough for the default GITHUB_TOKEN to tag and
      # release, and it cannot expire.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - uses: actions/download-artifact@v4
        with:
          name: wheel

      - name: Get version and create tag
        id: create_tag
        run: |
          VERSION=$(python -c 'exec(open("version.py").read()); print(__version__)')
          TAG="beta-$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if tag already exists (shouldn't happen, but safety check)
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Using existing tag."
          else
            git tag -a "$TAG" -m "Beta release: $TAG"
            git push origin "$TAG"
            echo "Created and pushed tag: $TAG"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog from git log
        id: changelog
        run: |
          TAG="${{ steps.create_tag.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" > changes.txt
          else
            git log --pretty=format:"- %s" > changes.txt
          fi
          if [ ! -s changes.txt ]; then
            echo "No changes found for $TAG" > changes.txt
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: ${{ steps.create_tag.outputs.tag }}
          body_path: changes.txt
          draft: false
          prerelease: true
          files: |
            spotyvibe_onefile.exe
            spotyvibe_package.zip
            SpotyVibe-macOS-Linux.zip

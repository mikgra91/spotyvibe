name: Beta Release

on:
  push:
    tags:
      - 'beta-*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller

      - name: Build Windows Executables
        shell: bash
        run: |
          ./build-tools/build_exe.sh --package
          ./build-tools/build_exe.sh --full

      - name: Archive one-folder package
        shell: bash
        run: |
          cd dist
          7z a spotyvibe_package.zip ./spotyvibe/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/spotyvibe_onefile.exe
            dist/spotyvibe_package.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK (debug)
        run: |
          ./build-tools/build_apk.sh debug
          cp android/app/build/outputs/apk/debug/app-debug.apk spotyvibe-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: spotyvibe-debug.apk

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - uses: actions/download-artifact@v4
        with:
          name: android

      - name: Generate changelog from git log
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" > changes.txt
          else
            git log --pretty=format:"- %s" > changes.txt
          fi
          if [ ! -s changes.txt ]; then
            echo "No changes found for $TAG" > changes.txt
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changes.txt
          draft: false
          prerelease: true
          files: |
            spotyvibe-debug.apk
            spotyvibe_onefile.exe
            spotyvibe_package.zip
[pytest]
testpaths = core/tests frontend/tests
markers =
    screenshots: documentation screenshot acquisition (deselected by default)
    perf: M2 perf-baseline regression checks (deselected by default; opt in with -m perf)
addopts = -m "not screenshots and not perf" --import-mode=importlib --tb=short -q
log_cli = false
log_level = WARNING

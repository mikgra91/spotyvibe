plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.spotyvibe.app'
    compileSdk 34

    sourceSets {
        main {
            python.srcDir "src/main/python"
        }
    }

    defaultConfig {
        applicationId "com.spotyvibe.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        python {
            version "3.10"

            pip {
                install "flask>=3.0,<4.0"
                // OpenAI API calls use direct HTTP (core/openai_http.py, stdlib urllib+json)
                // instead of the openai SDK. This avoids jiter (Rust, openai>=1.35) and
                // pydantic-core (Rust, pydantic>=2) which Chaquopy cannot build from source.
                install "spotipy>=2.23,<3.0"

                install "python-dotenv>=1.0,<2.0"
                install "markdown>=3.4,<4.0"
            }
        }

        ndk {
            // arm64-v8a for physical devices; x86_64 for Android Studio emulators.
            // Remove x86_64 from release builds to reduce APK size.
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
